openapi: 3.0.1
info:
  title: Library Management System API
  description: This API exposes endpoints for managing a library system.
  termsOfService: https://www.example.com/terms
  contact:
    name: Library Support
    url: https://www.example.com
    email: library@example.com
  license:
    name: MIT License
    url: https://choosealicense.com/licenses/mit/
  version: "1.0"
servers:
- url: http://localhost:8080
  description: Server URL in Development environment
tags:
- name: Book Management
  description: APIs for managing books in the library system
- name: Lender Management
  description: APIs for managing lenders in the library system
paths:
  /books/{id}:
    get:
      tags:
      - Book Management
      summary: Get a book by ID
      description: Retrieves a specific book using its ID
      operationId: getBookById
      parameters:
      - name: id
        in: path
        description: ID of the book to retrieve
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Book not found
        "200":
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponseDTO'
    put:
      tags:
      - Book Management
      summary: Update a book
      description: Updates an existing book's information
      operationId: updateBook
      parameters:
      - name: id
        in: path
        description: ID of the book to update
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequestDTO'
        required: true
      responses:
        "404":
          description: Book not found
        "400":
          description: Invalid input data
        "200":
          description: Book successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponseDTO'
    delete:
      tags:
      - Book Management
      summary: Delete a book
      description: Removes a book from the library system
      operationId: deleteBook
      parameters:
      - name: id
        in: path
        description: ID of the book to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Book not found
        "204":
          description: Book successfully deleted
  /lenders:
    get:
      tags:
      - Lender Management
      summary: Get all lenders
      description: Retrieves a list of all lenders registered in the library system
      operationId: getAllLenders
      responses:
        "200":
          description: Successfully retrieved the list of lenders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lender'
    post:
      tags:
      - Lender Management
      summary: Add a new lender
      description: Registers a new lender in the library system
      operationId: addLender
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Lender'
        required: true
      responses:
        "200":
          description: Lender successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lender'
        "400":
          description: Invalid input data
  /books:
    get:
      tags:
      - Book Management
      summary: Get all books
      description: Retrieves a list of all books available in the library
      operationId: getAllBooks
      responses:
        "200":
          description: Successfully retrieved the list of books
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponseDTO'
    post:
      tags:
      - Book Management
      summary: Add a new book
      description: Creates a new book in the library system
      operationId: addBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequestDTO'
        required: true
      responses:
        "200":
          description: Book successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponseDTO'
        "400":
          description: Invalid input data
  /lenders/{id}:
    get:
      tags:
      - Lender Management
      summary: Get a lender by ID
      description: Retrieves a specific lender using their ID
      operationId: getLenderById
      parameters:
      - name: id
        in: path
        description: ID of the lender to retrieve
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Lender not found
        "200":
          description: Lender found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lender'
    delete:
      tags:
      - Lender Management
      summary: Delete a lender
      description: Removes a lender from the library system
      operationId: deleteLender
      parameters:
      - name: id
        in: path
        description: ID of the lender to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "404":
          description: Lender not found
        "200":
          description: Lender successfully deleted
components:
  schemas:
    BookRequestDTO:
      type: object
      properties:
        name:
          type: string
        author:
          type: string
        genre:
          type: string
        language:
          type: string
      description: Book details
    BookResponseDTO:
      type: object
      properties:
        bookId:
          type: integer
          format: int64
        name:
          type: string
        author:
          type: string
        genre:
          type: string
        language:
          type: string
    Lender:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        borrowDate:
          type: string
          format: date
        returnDate:
          type: string
          format: date
